name: Build & Deploy

on:
  push:
    branches:
      - claude/plan-mvp-implementation-3maww
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 warnings

jobs:
  # ── 1. Deploy Flutter web to GitHub Pages ──────────────────────────────────
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Generate web platform files
        working-directory: frontend
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.cognios --project-name cognios --platforms web . 2>/dev/null || true
          cp pubspec.yaml.bak pubspec.yaml

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Flutter web
        working-directory: frontend
        run: |
          API_URL="${{ secrets.API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://cognios-api.onrender.com"; fi
          flutter build web --release \
            --base-href /bear-summit/ \
            --dart-define=API_URL="$API_URL"

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/build/web
          branch: gh-pages
          clean: true

  # ── 2. Build debug APK ─────────────────────────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      # Create a clean Flutter project in /tmp, then drop in our source.
      # More reliable than flutter create on an existing directory in CI.
      - name: Scaffold fresh Flutter project
        run: |
          flutter create \
            --org com.cognios \
            --project-name cognios \
            --platforms android \
            /tmp/cognios_build

      - name: Inject our source into scaffold
        run: |
          cp -r frontend/lib /tmp/cognios_build/
          cp frontend/pubspec.yaml /tmp/cognios_build/pubspec.yaml

      # Inject google-services.json for Firebase (stored as base64 GitHub secret).
      # If secret is not set yet, the build continues without FCM — demo mode still works.
      - name: Inject google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode \
              > /tmp/cognios_build/android/app/google-services.json
            echo "google-services.json injected"
          else
            echo "GOOGLE_SERVICES_JSON secret not set — skipping FCM setup"
          fi

      - name: Install dependencies
        working-directory: /tmp/cognios_build
        run: flutter pub get

      - name: Build debug APK
        working-directory: /tmp/cognios_build
        run: |
          API_URL="${{ secrets.API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://cognios-api.onrender.com"; fi
          flutter build apk --debug \
            --dart-define=API_URL="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: cognios-debug-apk
          path: /tmp/cognios_build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
