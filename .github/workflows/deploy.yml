name: Build & Deploy

on:
  push:
    branches:
      - claude/plan-mvp-implementation-3maww
      - main

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  # ── 1. Deploy Flutter web to GitHub Pages ──────────────────────────────────
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Generate web platform files (non-destructive)
        working-directory: frontend
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.cognios --project-name cognios --platforms web . 2>/dev/null || true
          cp pubspec.yaml.bak pubspec.yaml

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Flutter web
        working-directory: frontend
        run: |
          flutter build web --release \
            --base-href /bear-summit/ \
            --dart-define=API_URL=${{ secrets.API_URL || 'https://cognios-api.onrender.com' }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/build/web
          branch: gh-pages
          clean: true

  # ── 2. Build debug APK and upload as artifact ─────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files (non-destructive)
        working-directory: frontend
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.cognios --project-name cognios --platforms android . 2>/dev/null || true
          cp pubspec.yaml.bak pubspec.yaml

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build debug APK
        working-directory: frontend
        run: |
          flutter build apk --debug \
            --dart-define=API_URL=${{ secrets.API_URL || 'https://cognios-api.onrender.com' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognios-debug-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
