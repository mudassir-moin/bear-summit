services:
  - type: web
    name: cognios-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Safe demo default — app works immediately without any real API keys.
      # Change DEMO_MODE to "false" once you add real credentials below.
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      # Set the values below in the Render dashboard (not here — keep secrets out of git)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: SECRET_KEY
        generateValue: true
